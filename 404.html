<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0c18">
<title>Page introuvable – Snow CI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0c18;--acc:#5b4bf0;--lav:#b3a7ff;--ice:#bfe3ff;--tx:#f4f6ff;--mut:#9a9cc0;--line:rgba(255,255,255,.12)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:grid;place-items:center;padding:24px;color:var(--tx);font-family:Jost,'Helvetica Neue',Arial,sans-serif;font-weight:300;text-align:center;background:radial-gradient(900px 500px at 80% -10%,rgba(91,75,240,.3),transparent),var(--bg)}
.logo{display:inline-flex;align-items:center;gap:12px;margin-bottom:26px}
.logo b{font-family:'Playfair Display',serif;font-weight:900;font-size:40px;line-height:1;background:linear-gradient(#fff,var(--ice));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo span{letter-spacing:.4em;font-size:14px;text-align:left}.logo small{display:block;letter-spacing:.5em;font-size:9px;color:var(--lav);margin-top:3px}
.code{font-weight:500;font-size:clamp(90px,26vw,180px);line-height:1;margin:0;background:linear-gradient(135deg,var(--acc),var(--lav));-webkit-background-clip:text;background-clip:text;color:transparent}
h1{font-weight:500;font-size:clamp(22px,5vw,32px);margin:8px 0 10px;text-transform:uppercase;letter-spacing:.04em}
p{color:var(--mut);line-height:1.7;margin:0 auto 26px;max-width:420px}
a.btn{display:inline-block;text-decoration:none;color:#fff;background:linear-gradient(135deg,#5b4bf0,#8a7bff);padding:14px 28px;border-radius:999px;letter-spacing:.1em;text-transform:uppercase;font-size:12px;font-weight:400}
</style>
</head>
<body>
<main>
<div class="logo"><b>S</b><div><span>SNOW</span><small>CI</small></div></div>
<p class="code">404</p>
<h1>Page introuvable</h1>
<p>La page que vous cherchez n’existe pas ou a été déplacée.</p>
<a class="btn" id="home" href="/">Retour à l’accueil</a>
</main>
<script>
document.getElementById('home').href=location.pathname.indexOf('/snow_agency/')===0?'/snow_agency/':'/';
</script>
</body>
</html>
